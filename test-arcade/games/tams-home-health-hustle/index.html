<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tam's Home Health Hustle</title>
<style>
html,body{margin:0;height:100%;background:#0a1a2a;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#paTestBack{position:fixed;z-index:5;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));
  color:#14120c;background:#ffe14a;border:2px solid #14120c;border-radius:999px;text-decoration:none;
  font:700 13px/1 "Courier New",monospace;padding:6px 10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a id="paTestBack" href="../../">← Arcade</a>
<script>
/* Three days, three houses each. The road follows the long side of the screen. */
const SAVE = 'pa-test-health-v2';
const TITLE = "Tam's Home Health Hustle";
const SUB = '';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const NAMES = ['Miss Lottie', 'Mr. Earl', 'Aunt Pearl'];
const STOPS = [220, 520, 860];
let save = {day:1, visits:0};
try { save = Object.assign(save, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) {} }
let mode = 'title';
let day = Math.min(3, Math.max(1, save.day || 1));
let along = 40;
let vel = 0;
let done = [false, false, false];
const keys = {};
const ptrs = new Map();

function land() { return innerWidth > innerHeight * 1.05; }
function size() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function buttons() {
  const s = land() ? 78 : 100;
  const jump = {x: innerWidth - 16 - s / 2, y: innerHeight - 16 - s / 2, r: s / 2};
  const act = {x: jump.x - s - 16, y: jump.y, r: s / 2};
  return {act, jump};
}
function track() {
  const pad = land() ? 90 : 110;
  const span = (land() ? innerWidth : innerHeight) - pad * 2;
  return {pad, span: Math.max(120, span)};
}
function place(t) {
  const tr = track();
  const u = t / 1000;
  if (land()) return {x: tr.pad + u * tr.span, y: innerHeight * 0.48};
  return {x: innerWidth * 0.42, y: tr.pad + u * tr.span};
}
function hitBtn(x, y) {
  const b = buttons();
  if (Math.hypot(x - b.act.x, y - b.act.y) <= b.act.r + 8) return 'act';
  if (Math.hypot(x - b.jump.x, y - b.jump.y) <= b.jump.r + 8) return 'jump';
  return null;
}
function nearest() {
  let best = -1, bd = 1e9;
  STOPS.forEach((s, i) => { if (done[i]) return; const d = Math.abs(along - s); if (d < bd) { bd = d; best = i; } });
  return {i: best, d: bd};
}
function startRect() { return {x: innerWidth / 2 - 120, y: innerHeight * 0.62, w: 240, h: 64}; }
function beginDay() { mode = 'play'; along = 40; vel = 0; done = [false, false, false]; }
function doJump() { /* horn */ }
function doAction() {
  if (mode === 'title') { beginDay(); return; }
  if (mode === 'day') {
    if (day >= 3) { mode = 'end'; save.day = 1; persist(); return; }
    day++; save.day = day; persist(); beginDay(); return;
  }
  if (mode !== 'play') return;
  const n = nearest();
  if (n.i >= 0 && n.d < 70) {
    done[n.i] = true;
    save.visits = (save.visits || 0) + 1; persist();
    if (done.every(Boolean)) mode = 'day';
  }
}
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('a')) return;
  const b = hitBtn(e.clientX, e.clientY);
  if (b) { ptrs.set(e.pointerId, {btn:b}); if (b === 'act') doAction(); return; }
  if (mode === 'title' || mode === 'day' || mode === 'end') {
    const r = startRect();
    if (e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) doAction();
    return;
  }
  ptrs.set(e.pointerId, {ox:e.clientX, oy:e.clientY, x:e.clientX, y:e.clientY});
});
addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p || p.btn) return;
  p.x = e.clientX; p.y = e.clientY;
});
function endPtr(e) { ptrs.delete(e.pointerId); }
addEventListener('pointerup', endPtr);
addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'e' || e.key === 'E' || e.key === ' ' || e.key === 'Enter' || e.key === 'j' || e.key === 'J') doAction();
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('resize', size);
size();

function driveInput() {
  let v = 0;
  if (keys.ArrowRight || keys.ArrowDown || keys.d || keys.D || keys.s || keys.S) v += 1;
  if (keys.ArrowLeft || keys.ArrowUp || keys.a || keys.A || keys.w || keys.W) v -= 1;
  for (const p of ptrs.values()) {
    if (p.btn) continue;
    const dx = p.x - p.ox, dy = p.y - p.oy;
    const axis = land() ? dx : dy;
    if (Math.abs(axis) < 14) continue;
    v += Math.max(-1, Math.min(1, axis / 50));
  }
  return Math.max(-1, Math.min(1, v));
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  if (mode === 'play') {
    const input = driveInput();
    const want = input * 280;
    vel += (want - vel) * Math.min(1, dt * 8);
    if (Math.abs(input) < 0.05) vel *= Math.pow(0.02, dt);
    along = Math.max(0, Math.min(1000, along + vel * dt));
  }
  draw();
  publish();
  requestAnimationFrame(frame);
}
function round(btn, label, c0, c1) {
  ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, 7);
  const g = ctx.createRadialGradient(btn.x - btn.r * 0.3, btn.y - btn.r * 0.35, 4, btn.x, btn.y, btn.r);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '700 ' + Math.max(12, btn.r * 0.26) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, btn.x, btn.y);
}
function house(p, i, on) {
  ctx.fillStyle = on ? '#ffd23f' : '#f2e2c8';
  ctx.fillRect(p.x - 26, p.y - 28, 52, 36);
  ctx.fillStyle = '#a8423a'; ctx.beginPath(); ctx.moveTo(p.x - 32, p.y - 26); ctx.lineTo(p.x, p.y - 48); ctx.lineTo(p.x + 32, p.y - 26); ctx.fill();
  ctx.fillStyle = '#333'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(NAMES[i], p.x, p.y + 22);
}
function car(p) {
  ctx.fillStyle = '#ff6fae'; ctx.fillRect(p.x - 18, p.y - 10, 36, 18);
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(p.x, p.y - 16, 8, 0, 7); ctx.fill();
}
function draw() {
  const W = innerWidth, H = innerHeight;
  ctx.fillStyle = '#8fb56a'; ctx.fillRect(0, 0, W, H);
  if (land()) { ctx.fillStyle = '#5c6068'; ctx.fillRect(0, H * 0.48 - 28, W, 56); }
  else { ctx.fillStyle = '#5c6068'; ctx.fillRect(W * 0.42 - 28, 0, 56, H); }
  if (mode === 'play' || mode === 'day') {
    STOPS.forEach((s, i) => house(place(s), i, !done[i] && Math.abs(along - s) < 70));
    car(place(along));
  }
  if (mode === 'title') {
    ctx.fillStyle = 'rgba(10,26,42,.45)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '700 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(TITLE, W / 2, H * 0.30);
    if (SUB) { ctx.fillStyle = '#ffd23f'; ctx.font = '16px sans-serif'; ctx.fillText(SUB, W / 2, H * 0.36); }
    ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
    ctx.fillText('Three days. Drive the road. ACTION at each house.', W / 2, H * 0.44);
    const r = startRect();
    ctx.fillStyle = '#1f8fd6'; roundRect(r.x, r.y, r.w, r.h, 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 22px sans-serif'; ctx.fillText('START DAY ' + day, W / 2, r.y + 34);
    return;
  }
  if (mode === 'end') {
    ctx.fillStyle = 'rgba(10,26,42,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd23f'; ctx.font = '700 32px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('All three days are done', W / 2, H * 0.4);
    ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif';
    ctx.fillText('Nine visits. Tam heads home.', W / 2, H * 0.48);
    return;
  }
  if (mode === 'day') {
    ctx.fillStyle = 'rgba(10,26,42,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd23f'; ctx.font = '700 30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Day ' + day + ' complete', W / 2, H * 0.38);
    const r = startRect();
    ctx.fillStyle = '#1f8fd6'; roundRect(r.x, r.y, r.w, r.h, 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 20px sans-serif';
    ctx.fillText(day >= 3 ? 'FINISH' : 'NEXT DAY', W / 2, r.y + 34);
    return;
  }
  const n = nearest();
  ctx.fillStyle = '#fff'; ctx.font = '700 16px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Day ' + day + ' of 3  ·  ' + (n.i >= 0 && n.d < 70 ? 'ACTION · ' + NAMES[n.i] : 'Follow the road'), 12, 28);
  const b = buttons();
  round(b.act, 'ACTION', '#d8ffd0', '#1e8a32');
  round(b.jump, 'JUMP', '#ffe0b0', '#e07010');
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function publish() {
  const n = nearest();
  const hp = place(along);
  const tp = n.i >= 0 ? place(STOPS[n.i]) : hp;
  const b = buttons();
  const r = startRect();
  window.__G = {
    mode, day, along, done: mode === 'end', visits: done.filter(Boolean).length,
    land: land(),
    hero: {sx: hp.x, sy: hp.y},
    next: {sx: tp.x, sy: tp.y},
    near: mode === 'play' && n.i >= 0 && n.d < 70,
    dayReady: mode === 'day',
    jump: false,
    btn: {act:{x:b.act.x, y:b.act.y}, jump:{x:b.jump.x, y:b.jump.y}},
    start: {x: r.x + r.w / 2, y: r.y + r.h / 2}
  };
}
requestAnimationFrame(frame);
</script>
</body>
</html>
