<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pete's 420 Adventure</title>
<style>
html,body{margin:0;height:100%;background:#14081c;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#paTestBack{position:fixed;z-index:5;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));
  color:#14120c;background:#ffe14a;border:2px solid #14120c;border-radius:999px;text-decoration:none;
  font:700 13px/1 "Courier New",monospace;padding:6px 10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a id="paTestBack" href="../../">← Arcade</a>
<script>
/* Simple 3-room rebuild. Swipe anywhere to walk. Green ACTION, orange JUMP. */
const SAVE = 'pa-test-p420-v2';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const ROOMS = [
  {name:'Dispensary', job:'Spin the last pipe', who:'Budtender', line:'Seeds are in the bag. The grow room is through the door.'},
  {name:'Grow room', job:'Aim the grow light', who:'Grower', line:'Token earned. The lounge is next door.'},
  {name:'Chill lounge', job:'Click the kit together', who:'Host', line:'Stamp pressed. The night is complete.'}
];
let save = {room:0};
try { save = Object.assign(save, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) {} }

let mode = 'title';
let room = Math.min(2, save.room || 0);
let step = 0;
let pete = {x:90, y:200, vx:0, vy:0, hop:0};
let msg = '';
let msgT = 0;
const keys = {};
const ptrs = new Map();

function size() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function buttons() {
  const land = innerWidth > innerHeight;
  const s = land ? 84 : 104;
  const jump = {x: innerWidth - 18 - s / 2, y: innerHeight - 18 - s / 2, r: s / 2};
  const act = {x: jump.x - s - 18, y: jump.y, r: s / 2};
  return {act, jump};
}
function spots() {
  const W = innerWidth, H = innerHeight, b = buttons();
  const cap = b.act.x - b.act.r - 36;
  const bench = {x: Math.min(W * 0.30, cap), y: H * 0.46, r: 46, kind:'bench'};
  const pal = {x: Math.min(W * 0.58, cap), y: H * 0.30, r: 46, kind:'pal'};
  const door = {x: Math.min(W * 0.42, cap), y: H * 0.62, r: 46, kind:'door'};
  return {bench, pal, door};
}
function hitBtn(x, y) {
  const b = buttons();
  if (Math.hypot(x - b.act.x, y - b.act.y) <= b.act.r + 8) return 'act';
  if (Math.hypot(x - b.jump.x, y - b.jump.y) <= b.jump.r + 8) return 'jump';
  return null;
}
function startRect() {
  return {x: innerWidth / 2 - 110, y: innerHeight * 0.62, w: 220, h: 64};
}
function startGame() { mode = 'play'; step = 0; pete.x = 80; pete.y = innerHeight * 0.5; pete.vx = pete.vy = 0; msg = ROOMS[room].job; msgT = 2.2; }

function doAction() {
  if (mode === 'title') { startGame(); return; }
  if (mode === 'end') return;
  const s = spots();
  const near = (p) => Math.hypot(pete.x - p.x, pete.y - p.y) < p.r + 16;
  if (step === 0 && near(s.bench)) { step = 1; msg = 'Done. Talk to the ' + ROOMS[room].who.toLowerCase() + '.'; msgT = 2; return; }
  if (step === 1 && near(s.pal)) { step = 2; msg = ROOMS[room].line; msgT = 2.4; return; }
  if (step === 2 && near(s.door)) {
    if (room >= 2) { mode = 'end'; save.room = 0; persist(); return; }
    room++; save.room = room; persist(); step = 0; pete.x = 80; pete.y = innerHeight * 0.5;
    msg = ROOMS[room].job; msgT = 2.2;
  }
}
function doJump() { if (mode === 'play') pete.hop = 0.28; }

addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('a')) return;
  const btn = hitBtn(e.clientX, e.clientY);
  if (btn) { ptrs.set(e.pointerId, {btn}); if (btn === 'act') doAction(); else doJump(); return; }
  if (mode === 'title') {
    const r = startRect();
    if (e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) startGame();
    return;
  }
  ptrs.set(e.pointerId, {ox:e.clientX, oy:e.clientY, x:e.clientX, y:e.clientY});
});
addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p || p.btn) return;
  p.x = e.clientX; p.y = e.clientY;
});
function endPtr(e) { ptrs.delete(e.pointerId); }
addEventListener('pointerup', endPtr);
addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'e' || e.key === 'E' || e.key === ' ' || e.key === 'Enter') { doAction(); e.preventDefault(); }
  if (e.key === 'k' || e.key === 'K') doJump();
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('resize', size);
size();

function stick() {
  let x = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0);
  let y = (keys.ArrowDown || keys.s || keys.S ? 1 : 0) - (keys.ArrowUp || keys.w || keys.W ? 1 : 0);
  for (const p of ptrs.values()) {
    if (p.btn) continue;
    const dx = p.x - p.ox, dy = p.y - p.oy;
    if (Math.hypot(dx, dy) < 16) continue;
    x += Math.max(-1, Math.min(1, dx / 48));
    y += Math.max(-1, Math.min(1, dy / 48));
  }
  return {x: Math.max(-1, Math.min(1, x)), y: Math.max(-1, Math.min(1, y))};
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  if (msgT > 0) msgT -= dt;
  if (mode === 'play') {
    const st = stick();
    const speed = 240;
    pete.vx = st.x * speed;
    pete.vy = st.y * speed;
    pete.x = Math.max(36, Math.min(innerWidth - 36, pete.x + pete.vx * dt));
    pete.y = Math.max(70, Math.min(innerHeight - 36, pete.y + pete.vy * dt));
    if (pete.hop > 0) pete.hop -= dt;
  }
  draw();
  publish();
  requestAnimationFrame(frame);
}
function round(btn, label, c0, c1) {
  ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, 7);
  const g = ctx.createRadialGradient(btn.x - btn.r * 0.3, btn.y - btn.r * 0.35, 4, btn.x, btn.y, btn.r);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '700 ' + Math.max(13, btn.r * 0.28) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, btn.x, btn.y);
}
function person(x, y, shirt, hat) {
  ctx.fillStyle = '#3a2418'; ctx.fillRect(x - 10, y + 8, 8, 16); ctx.fillRect(x + 2, y + 8, 8, 16);
  ctx.fillStyle = shirt; ctx.fillRect(x - 16, y - 10, 32, 22);
  ctx.fillStyle = '#e0b090'; ctx.beginPath(); ctx.arc(x, y - 22, 12, 0, 7); ctx.fill();
  if (hat) { ctx.fillStyle = hat; ctx.fillRect(x - 14, y - 36, 28, 8); ctx.fillRect(x - 8, y - 44, 16, 10); }
}
function draw() {
  const W = innerWidth, H = innerHeight;
  ctx.clearRect(0, 0, W, H);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#2a1048'); sky.addColorStop(1, '#123024');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1b4332'; ctx.fillRect(0, H * 0.72, W, H);
  if (mode === 'title') {
    ctx.fillStyle = '#39ff88'; ctx.font = '700 36px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText("Pete's 420", W / 2, H * 0.28);
    ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif';
    ctx.fillText('Three rooms. Walk, tap ACTION, head out.', W / 2, H * 0.36);
    const r = startRect();
    ctx.fillStyle = '#39ff88'; roundRect(r.x, r.y, r.w, r.h, 16); ctx.fill();
    ctx.fillStyle = '#06210f'; ctx.font = '700 22px sans-serif'; ctx.fillText('START', W / 2, r.y + 34);
    return;
  }
  if (mode === 'end') {
    ctx.fillStyle = '#ffe14a'; ctx.font = '700 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Night complete', W / 2, H * 0.36);
    ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif';
    ctx.fillText('Seeds, a token, and the host’s stamp.', W / 2, H * 0.46);
    ctx.fillText('Pete heads home.', W / 2, H * 0.52);
    return;
  }
  const R = ROOMS[room];
  const s = spots();
  ctx.fillStyle = '#39ff88'; ctx.font = '700 22px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(R.name, 16, 36);
  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
  ctx.fillText(step === 0 ? R.job : step === 1 ? 'Talk to the ' + R.who : 'Take the door', 16, 60);
  function mark(p, color, label) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, p.x, p.y + 4);
  }
  if (step === 0) mark(s.bench, '#245c38', 'PIPES');
  if (step === 1) mark(s.pal, '#6a38a0', R.who.toUpperCase());
  if (step === 2) mark(s.door, '#c4473a', 'DOOR');
  const bob = pete.hop > 0 ? -10 : 0;
  person(pete.x, pete.y + bob, '#39ff88', '#16382a');
  if (msgT > 0) {
    ctx.fillStyle = 'rgba(0,0,0,.72)'; roundRect(W / 2 - 180, 78, 360, 44, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(msg, W / 2, 104);
  }
  const b = buttons();
  round(b.act, 'ACTION', '#d8ffd0', '#1e8a32');
  round(b.jump, 'JUMP', '#ffe0b0', '#e07010');
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function publish() {
  const s = spots();
  const target = mode !== 'play' ? null : step === 0 ? s.bench : step === 1 ? s.pal : s.door;
  const b = buttons();
  const r = startRect();
  window.__G = {
    mode, room, step, done: mode === 'end',
    hero: {sx: pete.x, sy: pete.y},
    next: target && {sx: target.x, sy: target.y},
    near: !!(target && Math.hypot(pete.x - target.x, pete.y - target.y) < target.r + 16),
    jump: false,
    btn: {act:{x:b.act.x, y:b.act.y}, jump:{x:b.jump.x, y:b.jump.y}},
    start: {x: r.x + r.w / 2, y: r.y + r.h / 2}
  };
}
requestAnimationFrame(frame);
</script>
</body>
</html>
