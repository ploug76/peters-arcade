<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tam's Road to Emmaus</title>
<style>
html,body{margin:0;height:100%;background:#1a120c;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#paTestBack{position:fixed;z-index:5;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));
  color:#14120c;background:#ffe14a;border:2px solid #14120c;border-radius:999px;text-decoration:none;
  font:700 13px/1 "Courier New",monospace;padding:6px 10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a id="paTestBack" href="../../">← Arcade</a>
<script>
/* Three short walks. Swipe to move, JUMP the one gap, ACTION to greet. */
const SAVE = 'pa-test-emmaus-v2';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const STAGES = [
  {name:'Leaving Jerusalem', who:'Cleopas', line:'Stay with us. The day is far spent.'},
  {name:'The open road', who:'A traveler', line:'We hoped he was the one to redeem Israel.'},
  {name:'Toward evening', who:'The stranger', line:'They knew him in the breaking of the bread.'}
];
const WORLD = 1000, GY = 250, GAP = {x0:430, x1:500}, PAL = 680, GOAL = 900;
let save = {stage:0};
try { save = Object.assign(save, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) {} }
let mode = 'title';
let stage = Math.min(2, save.stage || 0);
let talked = false;
let hero = {x:70, y:GY, vx:0, vy:0, on:true};
let cam = 0;
const keys = {};
const ptrs = new Map();
let jumpEdge = false;

function size() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function view() {
  const s = Math.min(innerWidth / 520, innerHeight / 320);
  return {s, ox:(innerWidth - 520 * s) / 2, oy:(innerHeight - 320 * s) / 2};
}
function toScreen(x, y) {
  const v = view();
  return {x: v.ox + (x - cam) * v.s, y: v.oy + y * v.s};
}
function buttons() {
  const land = innerWidth > innerHeight;
  const s = land ? 78 : 100;
  const jump = {x: innerWidth - 16 - s / 2, y: innerHeight - 16 - s / 2, r: s / 2};
  const act = {x: jump.x - s - 16, y: jump.y, r: s / 2};
  return {act, jump};
}
function hitBtn(x, y) {
  const b = buttons();
  if (Math.hypot(x - b.act.x, y - b.act.y) <= b.act.r + 8) return 'act';
  if (Math.hypot(x - b.jump.x, y - b.jump.y) <= b.jump.r + 8) return 'jump';
  return null;
}
function startRect() { return {x: innerWidth / 2 - 120, y: innerHeight * 0.62, w: 240, h: 64}; }
function begin() { mode = 'play'; talked = false; hero = {x:70, y:GY, vx:0, vy:0, on:true}; cam = 0; }
function doJump() { if (mode === 'play' && hero.on) { hero.vy = -560; hero.on = false; } }
function doAction() {
  if (mode === 'title') { begin(); return; }
  if (mode !== 'play') return;
  if (!talked && Math.abs(hero.x - PAL) < 56 && hero.on) talked = true;
}
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('a')) return;
  const b = hitBtn(e.clientX, e.clientY);
  if (b) { ptrs.set(e.pointerId, {btn:b}); if (b === 'act') doAction(); else doJump(); return; }
  if (mode === 'title') {
    const r = startRect();
    if (e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) begin();
    return;
  }
  ptrs.set(e.pointerId, {ox:e.clientX, oy:e.clientY, x:e.clientX, y:e.clientY, jumped:false});
});
addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p || p.btn) return;
  const dy = e.clientY - p.oy;
  if (!p.jumped && p.oy - e.clientY > 36 && Math.abs(dy) > Math.abs(e.clientX - p.ox)) { p.jumped = true; doJump(); }
  p.x = e.clientX; p.y = e.clientY;
});
function endPtr(e) { ptrs.delete(e.pointerId); }
addEventListener('pointerup', endPtr);
addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'k' || e.key === 'K') { if (!jumpEdge) { doJump(); jumpEdge = true; } }
  if (e.key === 'e' || e.key === 'E' || e.key === ' ' || e.key === 'Enter' || e.key === 'j' || e.key === 'J') doAction();
});
addEventListener('keyup', e => { keys[e.key] = false; if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'k' || e.key === 'K') jumpEdge = false; });
addEventListener('resize', size);
size();

function dir() {
  let d = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0);
  for (const p of ptrs.values()) {
    if (p.btn) continue;
    const dx = p.x - p.ox;
    if (Math.abs(dx) > 16) d += Math.sign(dx);
  }
  return Math.max(-1, Math.min(1, d));
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  if (mode === 'play') {
    hero.vx = dir() * 180;
    hero.x += hero.vx * dt;
    hero.vy += 1100 * dt;
    hero.y += hero.vy * dt;
    const over = hero.x > GAP.x0 && hero.x < GAP.x1;
    if (!over && hero.vy >= 0 && hero.y >= GY) { hero.y = GY; hero.vy = 0; hero.on = true; }
    else hero.on = false;
    if (hero.y > 340) { hero.x = Math.max(40, GAP.x0 - 40); hero.y = GY; hero.vy = 0; hero.on = true; }
    hero.x = Math.max(24, Math.min(WORLD - 24, hero.x));
    cam += ((Math.max(0, Math.min(WORLD - 520, hero.x - 180))) - cam) * Math.min(1, dt * 8);
    if (talked && hero.x >= GOAL && hero.on) {
      if (stage >= 2) { mode = 'end'; save.stage = 0; persist(); }
      else { stage++; save.stage = stage; persist(); talked = false; hero.x = 70; hero.y = GY; hero.vy = 0; hero.on = true; cam = 0; }
    }
  }
  draw();
  publish();
  requestAnimationFrame(frame);
}
function round(btn, label, c0, c1) {
  ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, 7);
  const g = ctx.createRadialGradient(btn.x - btn.r * 0.3, btn.y - btn.r * 0.35, 4, btn.x, btn.y, btn.r);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '700 ' + Math.max(12, btn.r * 0.26) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, btn.x, btn.y);
}
function draw() {
  const W = innerWidth, H = innerHeight, v = view();
  ctx.fillStyle = '#f3d2a4'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#7eb6e0'; ctx.fillRect(0, 0, W, v.oy + 120 * v.s);
  ctx.fillStyle = '#6a8a48';
  for (let i = 0; i < 5; i++) ctx.fillRect(v.ox + (i * 140 - cam * 0.2) * v.s, v.oy + 90 * v.s, 70 * v.s, 40 * v.s);
  ctx.save(); ctx.translate(v.ox, v.oy); ctx.scale(v.s, v.s); ctx.translate(-cam, 0);
  ctx.fillStyle = '#c4a574'; ctx.fillRect(0, GY, GAP.x0, 80);
  ctx.fillStyle = '#c4a574'; ctx.fillRect(GAP.x1, GY, WORLD - GAP.x1, 80);
  ctx.fillStyle = '#6aa0c8'; ctx.fillRect(GAP.x0, GY + 10, GAP.x1 - GAP.x0, 50);
  const px = PAL, talkedCol = talked ? '#2e7d32' : '#8a5a2a';
  ctx.fillStyle = talkedCol; ctx.fillRect(px - 14, GY - 48, 28, 36);
  ctx.fillStyle = '#e8c8a8'; ctx.beginPath(); ctx.arc(px, GY - 58, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(talked ? 'walk on' : 'ACTION', px, GY - 74);
  ctx.fillStyle = '#3a2010'; ctx.fillRect(hero.x - 12, hero.y - 46, 24, 32);
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(hero.x, hero.y - 56, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#c8742c'; ctx.fillRect(GOAL - 8, GY - 70, 16, 70);
  ctx.fillStyle = '#fff'; ctx.fillText('END', GOAL, GY - 80);
  ctx.restore();
  if (mode === 'title') {
    ctx.fillStyle = 'rgba(26,18,12,.45)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff8ee'; ctx.font = '700 32px Georgia, serif'; ctx.textAlign = 'center';
    ctx.fillText('Road to Emmaus', W / 2, H * 0.32);
    ctx.font = '18px Georgia, serif'; ctx.fillText('Three short walks to the village.', W / 2, H * 0.4);
    const r = startRect();
    ctx.fillStyle = '#c8742c'; roundRect(r.x, r.y, r.w, r.h, 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 22px sans-serif'; ctx.fillText('BEGIN', W / 2, r.y + 34);
    return;
  }
  if (mode === 'end') {
    ctx.fillStyle = 'rgba(26,18,12,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff8ee'; ctx.font = '700 32px Georgia, serif'; ctx.textAlign = 'center';
    ctx.fillText('The walk is finished', W / 2, H * 0.4);
    ctx.font = '18px Georgia, serif';
    ctx.fillText('They knew him in the breaking of the bread.', W / 2, H * 0.48);
    return;
  }
  ctx.fillStyle = '#3a2010'; ctx.font = '700 18px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Walk ' + (stage + 1) + ' of 3 · ' + STAGES[stage].name, 12, 28);
  const b = buttons();
  round(b.act, 'ACTION', '#d8ffd0', '#1e8a32');
  round(b.jump, 'JUMP', '#ffe0b0', '#e07010');
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function publish() {
  const hs = toScreen(hero.x, hero.y - 40);
  const target = !talked ? toScreen(PAL, GY - 40) : toScreen(GOAL, GY - 40);
  const b = buttons();
  const r = startRect();
  const approach = hero.on && hero.x > GAP.x0 - 120 && hero.x < GAP.x0 - 16;
  window.__G = {
    mode, stage, talked, done: mode === 'end',
    hero: {sx: hs.x, sy: hs.y, x: hero.x},
    next: {sx: target.x, sy: target.y},
    near: !talked && Math.abs(hero.x - PAL) < 56,
    jump: approach,
    btn: {act:{x:b.act.x, y:b.act.y}, jump:{x:b.jump.x, y:b.jump.y}},
    start: {x: r.x + r.w / 2, y: r.y + r.h / 2}
  };
}
requestAnimationFrame(frame);
</script>
</body>
</html>
