<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Constable Duncan &amp; Hope's Angels</title>
<meta name="theme-color" content="#2a1d3a">
<meta name="description" content="Constable Duncan and Hope's angels light the lane through Flemingsburg. Swap heroes. Each angel has her own gift.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>
<div id="pad" hidden><div id="swipeHint">SWIPE &amp; HOLD ANYWHERE TO MOVE<br>SWIPE UP TO JUMP</div><button id="bJump" class="big" type="button" aria-label="Jump">JUMP</button><button id="bAct" class="big" type="button" aria-label="Power">ACTION</button></div>
<div id="ui">
 <div id="loading"><div class="ldT">Constable Duncan<span>&amp; Hope's Angels</span></div><div class="ldBar"><i id="ldFill"></i></div></div>
 <section id="title" class="screen" hidden>
  <div id="titleBtns">
   <button id="bPlay" class="big">&#9654; PLAY</button>
   <button id="bLevels">LEVELS</button>
   <button id="bSound" class="small">Sound: On</button>
  </div>
 </section>
 <section id="levels" class="screen" hidden>
  <div class="lvHead"><button id="bLvBack" class="small">&#8592; Back</button><h2>Levels</h2></div>
  <div id="lvList"></div>
 </section>
 <section id="story" class="screen" hidden>
  <div id="storyBox">
   <div class="stTop"><img id="portrait" alt=""><div id="spk"></div></div>
   <div id="txt"></div>
   <div class="row"><button id="bSkip" class="skip">Skip &#9193;</button><button id="bNext">Next &#9654;</button></div>
  </div>
 </section>
 <section id="howto" class="screen card" hidden>
  <div class="cardIn"><div id="htNum"></div><h2 id="htTitle"></h2><p id="htText"></p><div id="htKeys"></div><button id="bStart" class="big">&#9654; START</button></div>
 </section>
 <div id="hud" hidden><span id="hudLv"></span><button id="bSwap" type="button" aria-label="Swap hero">SWAP</button><span id="hudInfo"></span><button id="bPause" aria-label="Pause">II</button></div>
 <section id="pause" class="screen card" hidden>
  <div class="cardIn"><h2>Paused</h2><button id="bResume" class="big">Resume</button><button id="bRestart">Restart level</button><button id="bSkipLv">Skip this level</button><button id="bPLevels">Levels</button><button id="bPSound" class="small">Sound: On</button></div>
 </section>
 <section id="result" class="screen card" hidden>
  <div class="cardIn"><h2 id="rsTitle"></h2><div id="rsStars"><i>&#9733;</i><i>&#9733;</i><i>&#9733;</i></div><p id="rsText"></p><button id="bContinue" class="big">Continue &#9654;</button><button id="bRetry">&#8635; Play again</button></div>
 </section>
 <div id="toast"></div>
</div>
<script src="js/game.js?v=2"></script>
<a id="paTestBack" class="review" href="../../" aria-label="Back to Test Arcade. Review build."><b>← Arcade</b></a>
<style>
#paTestBack{position:fixed;z-index:100000;left:max(6px,env(safe-area-inset-left));top:max(6px,env(safe-area-inset-top));display:inline-flex;align-items:center;text-decoration:none;background:#ffe14a;color:#14120c;border:2px solid #14120c;border-radius:999px;padding:6px 10px;font:700 13px/1 "Courier New",ui-monospace,monospace;touch-action:manipulation;white-space:nowrap}
#paTestBack.adult{background:#ffb4b4;left:auto;right:max(6px,env(safe-area-inset-right));top:calc(60px + env(safe-area-inset-top))}
#paTestBack.prototype{background:#ffd59a}
</style>
</body>
</html>
